[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ddg-search-mcp-Albertous007"
version = "1.0.1"
authors = [{ name = "Albertous007" }]
description = "DuckDuckGo Search MCP Server with anti-bot protection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2.0",
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "trafilatura>=1.6.0",
]

[project.urls]
Homepage = "https://github.com/Albertous007/ddg-search-mcp"
Issues = "https://github.com/Albertous007/ddg-search-mcp/issues"

[project.scripts]
ddg-search-mcp = "ddg_search_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ddg_search_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: marks tests that require internet access",
]
